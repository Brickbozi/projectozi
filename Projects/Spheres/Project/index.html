        /**

        let gravity = 15
        let ballCount = 200
        let balls = []

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

            const vs = await fetch('vs.glsl').then(res => res.text())

            gl.enable(gl.BLEND)
            gl.disable(gl.CULL_FACE)

        /**
         * Compiles two shaders, links them together, looks up their uniform locations,
         * and returns the result. Reports any shader errors to the console.
         *
         * @param {string} vs_source - the source code of the vertex shader
         * @param {string} fs_source - the source code of the fragment shader
         * @return {WebGLProgram} the compiled and linked program
         */
        function compile(vs_source, fs_source) {
            const vs = gl.createShader(gl.VERTEX_SHADER)

            gl.shaderSource(vs, vs_source)
            gl.compileShader(vs)
            if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(vs))
                throw Error("Vertex shader compilation failed")
            }

            const fs = gl.createShader(gl.FRAGMENT_SHADER)
            gl.shaderSource(fs, fs_source)
            gl.compileShader(fs)
            if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(fs))
                throw Error("Fragment shader compilation failed")
            }

            const program = gl.createProgram()
            gl.attachShader(program, vs)
            gl.attachShader(program, fs)
            gl.linkProgram(program)
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program))
                throw Error("Linking failed")
            }

            const uniforms = {}
            for (i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i += 1) {
                info = gl.getActiveUniform(program, i)
                uniforms[info.name] = gl.getUniformLocation(program, info.name)
            }
            program.uniforms = uniforms

            return program
        }




        /**
         * Runs the animation using requestAnimationFrame. This is like a loop that
         * runs once per screen refresh, but a loop won't work because we need to 
         * the browser do other things between ticks. Instead, we have a function that
         * requests itself be queued to be run again as its last step.
         * 
         * @param {Number} milliseconds - milliseconds since web page loaded, 
         *        automatically provided by the browser when invoked with
         *        requestAnimationFrame
         */
        function tick(milliseconds) {
            const seconds = milliseconds / 1000
            draw(seconds)
            requestAnimationFrame(tick) // <- only call this here, nowhere else
        }

        function toRads(degrees) {
            return degrees * (Math.PI / 180)
        }

        /**
         * Clears the screen, sends two uniforms to the GPU, and asks the GPU to draw
         * several points. Note that no geometry is provided, the point locations are
         * computed based on the uniforms in the vertex shader.
         *
         * @param {Number} seconds - the number of seconds since the animation began
         */

        function isOverlapping1D(line1, line2) {
            return line1[1] >= line2[0] && line2[1] >= line1[0]
        }

        function isOverlapping2D(box1, box2) {
            return isOverlapping1D(box1[0], box2[0]) && isOverlapping1D(box1[1], box2[1])
        }

        function draw(seconds) {
            //if (posY >= 12) {return,}
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)
            gl.useProgram(program)
            gl.uniformMatrix4fv(program.uniforms.p, false, p)
                // Sun
                // m4trans(seconds * Math.PI)
                // 12 is the bottom of the screen
            for (let i = 0; i < balls.length; i++) {
                obj = balls[i];
                change = seconds - obj.lastTime
                obj.lastTime = seconds
                obj.posY = obj.posY + (obj.velocity[1] * change)
                obj.posX = obj.posX + (obj.velocity[0] * change)
                    //console.log(velocity)
                for (let e = 0; e < 2; e++) {
                    obj.velocity[e] = obj.velocity[e] + (obj.acceleration[e] * change)
                }
                for (let j = 0; j < balls.length; j++) {

                    obj_j = balls[j];
                    if (i == j) {
                        continue;
                    }

                    //console.log([obj.posX, obj.posY])

                    i_diff = sub([obj.posX, obj.posY], [obj_j.posX, obj_j.posY])
                    j_diff = sub([obj_j.posX, obj_j.posY], [obj.posX, obj.posY])
                    distance = ((obj.posX - obj_j.posX) ** 2 + (obj.posY - obj_j.posY) ** 2) ** 0.5
                    if (distance <= obj.rad + obj_j.rad) {

                        let n = sub([obj.posX, obj.posY], [obj_j.posX, obj_j.posY]); // collision normal
                        let v = sub(obj.velocity, obj_j.velocity);

                        let vn = dot(v, n);
                        if (vn > 0) continue; // already separating

                        let m1 = obj.mass;
                        let m2 = obj_j.mass;

                        let impulse = (1.9 * vn) / ((m1 + m2) * dot(n, n));

                        let impulseVec = mul(n, impulse);

                        obj.velocity = sub(obj.velocity, mul(impulseVec, m2));
                        obj_j.velocity = add(obj_j.velocity, mul(impulseVec, m1));
                    }

                }
                floorDist = 12 - (obj.posY + obj.rad)
                if (floorDist <= 0 && obj.velocity[1] > 0) {

                    direction = [0, -1]
                    weight = 1
                    s = dot(obj.velocity, direction)
                    corr = weight * (1 + 0.5)
                    s = s * corr
                    speed = mul(direction, s)
                    obj.velocity = sub(obj.velocity, speed)
                    obj.velocity[1] = obj.velocity[1] ** 2 < 1. ? 0 : obj.velocity[1]
                    if (obj.velocity[1] == 0) {
                        obj.posY = 12 - (obj.rad)
                            //console.log(obj.posY)
                    }
                }

                rightDist = (obj.posX + obj.rad)
                if (rightDist >= 12 && obj.velocity[0] > 0) {
                    //console.log(obj.velocity[0])
                    direction = [-1, 0]
                    weight = 1
                    s = dot(obj.velocity, direction)
                    corr = weight * (1 + 0.9)
                    s = s * corr
                    speed = mul(direction, s)
                    obj.velocity = sub(obj.velocity, speed)
                    obj.velocity[1] = obj.velocity[1] ** 2 < 1. ? 0 : obj.velocity[1]
                }
                leftDist = (obj.posX - obj.rad)
                if (leftDist <= -12 && obj.velocity[0] < 0) {
                    direction = [1, 0]
                    weight = 1
                    s = dot(obj.velocity, direction)
                    corr = weight * (1 + 0.9)
                    s = s * corr
                    speed = mul(direction, s)
                    obj.velocity = sub(obj.velocity, speed)

                }
                m = m4mul(m4trans(obj.posX, -15, obj.posY), m4scale(obj.rad, obj.rad, obj.rad))
                v = m4view([0, 10, .1], [0, 0, 0], [0, 1, 0])
                gl.uniformMatrix4fv(program.uniforms.mv, false, m4mul(v, m))
                gl.uniform3fv(program.uniforms.color, obj.color);
                gl.drawElements(obj.mode, obj.count, obj.type, 0)
            }

        }

        /**
         * Resizes the canvas to the largest square the screen can hold
         */
        function fillScreen() {
            canvas = document.querySelector('canvas')
            document.body.style.margin = '0'
            canvas.style.width = '100vw'
            canvas.style.height = '100vh'
            canvas.width = canvas.clientWidth
            canvas.height = canvas.clientHeight
            canvas.style.width = ''
            canvas.style.height = ''
            if (window.gl) {
                gl.viewport(0, 0, canvas.width, canvas.height)
                window.p = m4perspNegZ(0.01, 100, 1, canvas.width, canvas.height)
            }
        }

        function supplyDataBuffer(data, loc, mode = gl.STATIC_DRAW) {

            const buf = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, buf)
            const f32 = new Float32Array(data.flat())
            gl.bufferData(gl.ARRAY_BUFFER, f32, mode)

            gl.vertexAttribPointer(loc, data[0].length, gl.FLOAT, false, 0, 0)
            gl.enableVertexAttribArray(loc)

            return buf
        }

        function setupGeometry(geom) {
            var triangleArray = gl.createVertexArray()
            gl.bindVertexArray(triangleArray)
                //console.log(geom)
            for (i = 0; i < geom.attributes.length; i++) {
                data = geom.attributes[i]
                supplyDataBuffer(data, i)
            }

            var indices = new Uint16Array(geom.triangles.flat())
            var indexBuffer = gl.createBuffer()
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer)
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW)

            function getRandomInt(max) {
                return Math.floor(Math.random() * max);
            }
            ranColor = new Float32Array([Math.random(), Math.random(), Math.random()])
            return {
                acceleration: [0, gravity],
                color: ranColor,
                lastTime: 0,
                pnew: 0,
                velocity: [(((getRandomInt(2)) * 2) - 1) * (1. * Math.random()), 0],
                mass: Math.random(),
                posX: getRandomInt(11) * (((getRandomInt(2)) * 2) - 1),
                posY: getRandomInt(11) * -1,
                rad: 1.2 * Math.random(),
                mode: gl.TRIANGLES,
                count: indices.length,
                type: gl.UNSIGNED_SHORT,
                vao: triangleArray
            }
        }



        window.addEventListener('load', setup)
