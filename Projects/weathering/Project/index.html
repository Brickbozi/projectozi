<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Weathering</title>
    <script src="math.js"></script>

    <script defer src="setup.js"></script>
    <script defer src="draw.js"></script>
    <script defer src="control.js"></script>
    <style>
        body {
            margin: 0;
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }
        
        .controls {
            flex: 0 0 auto;
        }
        
        .controls>* {
            margin: 1em;
        }
        
        .display {
            flex-grow: 1;
            line-height: 0rem;
        }
    </style>
</head>

<body>
    <form class="controls" action="javascript:void(0);">
        <label>Grid size: <input id="gridsize" type="number" value="50"/></label>
        <label>Faults: <input id="faults" type="number" value="50"/></label>
        <label>Weathering: <input id="weathering" type="number" value="0"/></label>
        <label>Height Map: <input id="hmap" type="checkbox" value="heightMap"></label>
        <label>Rotation<input id="rotate" type="checkbox" value="rotate"></label>
        <label>Camera Control<input id="ctrlCam" type="checkbox" value="ctrlCam"></label>
        
        <input id="submit" type="submit" value="Regenerate Terrain" />
    </form>
    <div class="display">
        <canvas width="300" height="300"></canvas>
    </div>
</body>

</html>
